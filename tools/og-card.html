<!doctype html>
<!-- Renders og-card.png (1200x630). Serve grid-game/ over http, open /tools/og-card.html at a 1200x630
     viewport and screenshot the #card element. Drawn from the game's own sim, dial and palette. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Hold 60 og card</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    html, body { margin: 0; background: var(--bg); }
    #card { width: 1200px; height: 630px; box-sizing: border-box; padding: 54px 64px; display: grid; grid-template-columns: 470px 1fr; gap: 48px; align-items: center; background: var(--bg); position: relative; overflow: hidden; }
    .left { display: flex; flex-direction: column; align-items: flex-start; }
    .wordmark { font-size: 40px; margin: 0 0 6px; }
    #dial { width: 440px; margin: 0 0 0 -6px; }
    .hz { font: 600 54px var(--mono); margin: 0; color: var(--ink); }
    .hz small { font: 700 20px var(--font); color: var(--muted); margin-left: 8px; }
    .hz .st { font: 800 18px var(--font); letter-spacing: .1em; color: var(--ok); margin-left: 14px; }
    .right h1 { font-family: var(--font-display); font-stretch: condensed; font-size: 92px; line-height: .98; margin: 0 0 18px; letter-spacing: -.01em; }
    .right p { font-size: 28px; line-height: 1.3; color: var(--ink-2); margin: 0 0 26px; max-width: 560px; }
    canvas { display: block; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
    .cells { display: grid; grid-template-columns: repeat(24, 1fr); gap: 4px; margin-top: 16px; width: 560px; }
    .cells i { aspect-ratio: 1; border-radius: 4px; background: var(--ok); display: block; }
    .cells i.yellow { background: var(--warn); }
    .cells i.red { background: var(--bad); }
    .tag { position: absolute; left: 64px; bottom: 34px; font: 700 20px var(--mono); color: var(--muted); letter-spacing: .04em; }
  </style>
</head>
<body>
<div id="card">
  <div class="left">
    <p class="wordmark">HOLD<span>60</span></p>
    <div id="dial"></div>
    <p class="hz"><span id="hz">60.00</span><small>Hz</small><span class="st">STABLE</span></p>
  </div>
  <div class="right">
    <h1>Keep the grid<br>at 60&nbsp;Hz.</h1>
    <p>A new grid every day. Run it by hand, or write the dispatch code. Heatwaves, winter storms, a 1.8 GW AI campus.</p>
    <canvas id="c" width="560" height="170"></canvas>
    <div class="cells" id="cells"></div>
  </div>
  <div class="tag">DAILY CHALLENGE · NO SIGN-UP</div>
</div>
<script type="module">
  import { createDial } from '../src/ui/dial.js';
  import { runDay } from '../src/sim.js';
  import { getScenario } from '../src/scenarios.js';
  import { lookAhead } from '../src/policies.js';

  const { sim, result } = runDay(getScenario('heatwave'), lookAhead);
  const dial = createDial(document.getElementById('dial'));
  dial.set(59.94);
  document.getElementById('hz').textContent = '59.94';

  const cs = getComputedStyle(document.documentElement);
  const v = (n) => cs.getPropertyValue(n).trim();
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, N = 1440;
  const STACK = ['nuclear', 'coal', 'gas', 'peaker', 'wind', 'solar', 'battery'];
  const ymax = 11000;
  const X = (m) => 8 + (m / N) * (W - 16), Y = (mw) => H - 8 - (Math.max(0, mw) / ymax) * (H - 20);
  const base = new Float32Array(N);
  for (const id of STACK) {
    ctx.beginPath(); ctx.moveTo(X(0), Y(base[0]));
    for (let m = 0; m < N; m += 3) ctx.lineTo(X(m), Y(base[m] + Math.max(0, sim.hist[id][m])));
    for (let m = N - 1; m >= 0; m -= 3) ctx.lineTo(X(m), Y(base[m]));
    ctx.closePath(); ctx.fillStyle = v('--c-' + id); ctx.globalAlpha = .85; ctx.fill(); ctx.globalAlpha = 1;
    for (let m = 0; m < N; m++) base[m] += Math.max(0, sim.hist[id][m]);
  }
  ctx.beginPath();
  for (let m = 0; m < N; m += 3) (m ? ctx.lineTo : ctx.moveTo).call(ctx, X(m), Y(sim.hist.demand[m]));
  ctx.strokeStyle = v('--ink'); ctx.lineWidth = 2.5; ctx.stroke();

  document.getElementById('cells').innerHTML = result.cells.map((c) => `<i class="${c}"></i>`).join('');
  document.title = 'ready';
</script>
</body>
</html>
